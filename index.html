
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios Vue.js</title>

    <style>
        .titulo-saudacao {
            color: teal;
        }
    </style>
</head>
<body>

    <div id="app">
        <saudacao
            :nome="aluno1"
            @cumprimentou="registrar">
        </saudacao>

        <saudacao
            :nome="aluno2"
            @cumprimentou="registrar">
        </saudacao>

        <p>{{ recado }}</p>
    </div>

    <script src="https://unpkg.com/vue@3.2.47/dist/vue.global.js"></script>

    <script>
        // Verificando se o Vue foi carregado
        if (typeof Vue === 'undefined') {
            document.getElementById('app').innerHTML =
                '<h1>Erro: Vue não foi carregado!</h1>';
        } else {

            // Criando o componente
            const Saudacao = {
                props: ['nome'],
                emits: ['cumprimentou'],

                template: `
                    <div>
                        <h1 class="titulo-saudacao">
                            Olá, {{ nome }}!
                        </h1>

                        <button @click="$emit('cumprimentou', nome)">
                            Cumprimentar
                        </button>
                    </div>
                `
            };

            // Criando a aplicação Vue
            const app = Vue.createApp({
                setup() {
                    const aluno1 = Vue.ref('Ana');
                    const aluno2 = Vue.ref('Bruno');

                    const recado = Vue.ref('Esperando um clique.');

                    // Função executada quando um botão é clicado
                    function registrar() {
                        recado.value = nome + 'cumprimentou.';
                    }

                    return {
                        aluno1,
                        aluno2,
                        recado,
                        registrar
                    };
                }
            });

            // Registrando o componente
            app.component('saudacao', Saudacao);

            // Iniciando a aplicação
            app.mount('#app');
        }
    </script>

</body>
</html>
