<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios Vue.js</title>
</head>
<body>

    <div id="app">
        <saudacao nome="Gustavo"></saudacao>
    </div>

    <script src="https://unpkg.com/vue@3.2.47/dist/vue.global.js"></script>

    <script>
        // Verificando se o Vue foi carregado
        if (typeof Vue === 'undefined') {
            document.getElementById('app').innerHTML =
            '<h1>Erro: Vue não foi carregado!</h1>';
        } else {
            const Saudacao = {
            template: '<h1 class = "titulo-saudacao">
                Olá, {{ nome }}
                </h1>'
        };
        const app = Vue.createApp({});
        app.component('saudacao', Saudacao);
        app.mount('#app');
    }
    </script>

    <style>
        .titulo-saudacao{
            color: teal;
        }
    </style>

</body>
</html>
